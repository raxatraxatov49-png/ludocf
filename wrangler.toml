name = "ludocf"
main = "cf/worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/ws", "/telegram-webhook", "/health", "/_debug"]

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

[vars]
# ӨЗГЕРТ: Worker сілтемесі және боттың username-і (@-сыз)
WEBHOOK_URL = "https://ludo-cf.raxatarzubaev.workers.dev/telegram-webhook"
MINI_APP_URL = "https://ludo-cf.raxatarzubaev.workers.dev"
BOT_USERNAME = "YOUR_BOT_USERNAME"
# Сынақ режимі (нағыз ботқа тимейді). Нағыз ботқа көшкенде екі жолды да өшір:
DEV = "1"
SKIP_WEBHOOK = "1"
