
name = "ludocf"
main = "cf/worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/ws", "/telegram-webhook", "/health", "/_debug"]

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

[vars]
WEBHOOK_URL = "https://ludocf.raxatraxatov49.workers.dev/telegram-webhook"
MINI_APP_URL = "https://ludocf.raxatraxatov49.workers.dev"
BOT_USERNAME = "ludomilliybot"
