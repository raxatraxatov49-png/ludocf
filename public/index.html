<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0f1f">
<title>Ludo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="extra.css">
</head>
<body>

<!-- Бас мәзір -->
<main id="menu" class="screen active">
  <div class="menuwrap">
    <header class="prof">
      <div class="ringava novip" id="meRing"><i class="crown" id="meCrown" aria-hidden="true">👑</i><div class="ava" id="meAva"></div></div>
      <div class="pn"><b id="meName">…</b><small data-i18n="role"></small><small id="meStats"></small></div>
      <div class="langs" id="langs">
        <button data-lang="kk">ҚАЗ</button><button data-lang="uz">UZ</button><button data-lang="ru">РУС</button>
      </div>
    </header>

    <section class="hero">
      <h2 data-i18n="randomTitle"></h2>
      <p data-i18n="randomDesc"></p>
      <button id="btnRandom" class="gold"><span class="tri"></span><span data-i18n="play"></span></button>
    </section>

    <section class="hero friend">
      <h2 data-i18n="friendTitle"></h2>
      <p data-i18n="friendDesc"></p>
      <button id="btnFriend" class="blue"><span data-i18n="friendBtn"></span></button>
    </section>

    <button id="btnPlayers" class="row" type="button">
      <span class="ico">🎮</span>
      <span class="rt"><b data-i18n="playersTitle"></b><em id="plOnlineBadge"></em></span>
      <span class="chev">›</span>
    </button>
    <div id="conn" class="conn hidden" data-i18n="connecting"></div>
  </div>
</main>

<!-- VIP -->
<main id="vip" class="screen navscr">
  <div class="pg">
    <div class="pghead"><h1 class="vgold">👑 Ludo VIP</h1></div>
    <p class="vsub" id="vipP"></p>
    <ul class="perks" id="vipPerks"></ul>
    <section class="vipcard" id="vipCard">
      <h2 id="vipH"></h2>
      <div class="bar7" id="vipBar"></div>
      <div class="vcount" id="vipCnt"></div>
      <button id="btnVipInv" class="pill go" type="button"><span data-i18n="vipInvite"></span></button>
      <small class="vhow" data-i18n="vipHow"></small>
    </section>
  </div>
</main>

<!-- Дүкен -->
<main id="shop" class="screen navscr">
  <div class="pg">
    <div class="pghead"><h1 data-i18n="shopTitle"></h1><div class="pts vipb hidden" id="shopVip">👑 VIP</div></div>
    <p class="note" data-i18n="shopNote"></p>
    <h3 class="sect" data-i18n="shopSkins"></h3>
    <div id="shopGrid" class="shopgrid"></div>
  </div>
</main>

<!-- Ойыншылар тізімі -->
<main id="players" class="screen">
  <div class="sbar">
    <button class="sback" id="plBack" type="button" aria-label="Back">‹</button>
    <h1 data-i18n="playersTitle"></h1>
    <button id="btnDnd" class="dndbtn" type="button" role="switch" aria-checked="false" aria-label="DND"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="#f4c542"/></svg><span class="sw"></span></button>
  </div>
  <p id="plCount" class="dndhint"></p>
  <p id="dndHint" class="dndhint" data-i18n="dndHint"></p>
  <p id="dndNote" class="dndnote hidden" data-i18n="dndNote"></p>
  <div id="plList" class="plscroll"></div>
</main>

<!-- Ойыншыларды күту (кездейсоқ іздеу де, доспен бөлме де) -->
<main id="wait" class="screen">
  <h2 class="wtitle" id="wTitle"></h2>
  <div class="wcount" id="wCount">1/4</div>
  <div id="wTimer" class="wtimer"></div>
  <div class="slots" id="slots"></div>
  <button id="btnInvite" class="pill hidden" data-i18n="invite"></button>
  <button id="btnStart" class="pill go hidden" data-i18n="startGame"></button>
  <button id="btnCancel" class="pill hidden" data-i18n="cancel"></button>
  <div id="wBar" class="gbar hidden"><button id="btnWaitBack" class="gb" type="button"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span data-i18n="menu"></span></button><button id="btnChatW" class="gb chatbtn" type="button"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M5 4h14a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H10l-5 4v-4H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/></svg><span data-i18n="chatTitle"></span><b class="badge hidden"></b></button></div>
</main>

<!-- Ойын -->
<main id="game" class="screen">
  <div class="bar top">
    <div class="pcard" id="card0"></div>
    <div class="pcard" id="card1"></div>
  </div>
  <div id="hint" class="hint"></div>
  <div class="boardwrap"><svg id="board" viewBox="-0.15 -0.85 15.3 15.95"></svg></div>
  <div class="bar bottom">
    <div class="pcard" id="card3"></div>
    <div class="pcard" id="card2"></div>
  </div>
  <div id="gBar" class="gbar"><button id="btnGameBack" class="gb" type="button"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span data-i18n="menu"></span></button><button id="btnChatG" class="gb chatbtn" type="button"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M5 4h14a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H10l-5 4v-4H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/></svg><span data-i18n="chatTitle"></span><b class="badge hidden"></b></button><button id="btnStk" class="gb hidden" type="button" aria-label="stickers"><span class="stkico">😎</span></button></div>
  <div id="stk" class="stk hidden"></div>
  <div id="over" class="over hidden">
    <div class="obox">
      <div class="otitle" data-i18n="overTitle"></div>
      <div class="oname" id="oName"></div>
      <div id="oMine" class="omine hidden"></div>
      <div id="oList" class="olist"></div>
      <button id="btnOver" class="pill go" data-i18n="toMenu"></button>
    </div>
  </div>
  <div id="fin" class="over hidden">
    <div class="obox finbox">
      <div class="bigmedal" id="finMedal"></div>
      <div class="fintitle" id="finTitle"></div>
      <div class="finpts" id="finPts"></div>
      <p class="finhint" data-i18n="finHint"></p>
      <button id="finWatch" class="pill go" data-i18n="finWatch"></button>
      <button id="finMenu" class="pill ghost" data-i18n="finMenu"></button>
    </div>
  </div>
</main>

<div id="ask" class="over sheetov hidden">
  <div class="sheet">
    <button id="askYes" class="sbtn red" type="button"></button>
    <button id="askNo" class="sbtn" type="button" data-i18n="closeX"></button>
  </div>
</div>

<!-- Кіріс шақыру -->
<div id="inv" class="over hidden" style="z-index:8">
  <div class="obox">
    <div class="ava big" id="invAva"></div>
    <div class="oname" id="invName" style="margin:10px 0 4px"></div>
    <div class="otitle" data-i18n="invText"></div>
    <div id="invTm" class="wtimer"></div>
    <button id="invYes" class="pill go" data-i18n="accept"></button>
    <button id="invNo" class="pill ghost" data-i18n="decline"></button>
  </div>
</div>

<!-- Чат -->
<div id="chat" class="chat hidden">
  <div class="chead"><b data-i18n="chatTitle"></b><button id="chatClose" type="button" aria-label="close">✕</button></div>
  <div id="chatList" class="clist"></div>
  <div class="cquick"><button type="button">👍</button><button type="button">😂</button><button type="button">😡</button><button type="button">🔥</button><button type="button">😎</button></div>
  <div class="cform"><input id="chatInput" maxlength="200" autocomplete="off" data-i18n-ph="chatPh"><button id="chatSend" type="button" aria-label="send">➤</button></div>
</div>

<nav id="nav" class="nav hidden">
  <button data-go="menu" type="button"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg><span data-i18n="navGame"></span></button>
  <button data-go="vip" type="button"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/></svg><span>VIP</span></button>
  <button data-go="shop" type="button"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span data-i18n="navShop"></span></button>
</nav>

<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
